repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(ML/models/|ML/datasets/|ML/evaluation/results/|plugin/legacy/|scratch/|planning/).*'
      - id: end-of-file-fixer
        exclude: '^(ML/models/|ML/datasets/|ML/evaluation/results/|plugin/legacy/|scratch/|planning/).*'
      - id: check-yaml
      - id: check-json
        exclude: '^(ML/models/|ML/datasets/).*'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: '^(package\.lock\.json|planning/.*|scratch/.*|ML/models/.*|ML/datasets/.*)$'
