name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal dev deps
        # We DO NOT install torch / transformers / speechrecognition in CI.
        # Tests marked `requires_torch` are auto-skipped via conftest.
        # This keeps CI fast and the runner image small.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff==0.16.2 mypy==2.3.1 word2number num2words \
            fastapi 'uvicorn[standard]' python-multipart httpx

      - name: Ruff lint
        run: ruff check ML plugin tests dashboard scripts

      - name: Ruff format check
        run: ruff format --check ML plugin tests dashboard scripts

      - name: Mypy (type-check vimaan_nlu + plugin)
        # torch/transformers are intentionally absent in CI; the mypy config
        # treats them as Any (ignore_missing_imports), so this stays fast.
        run: mypy

      - name: Compileall (syntax sanity)
        run: python -m compileall -q ML plugin dashboard scripts

      - name: Pytest (skips torch-only tests)
        run: pytest -q --cov=ML/vimaan_nlu --cov=ML/utils --cov=dashboard --cov-report=term-missing
